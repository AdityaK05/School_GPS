<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School Transport Safety & Accountability Platform — Admin Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Leaflet Real Geographic Cartography Engine -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: #09090b;
        color: #f4f4f5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #09090b;
      }
      ::-webkit-scrollbar-thumb {
        background: #27272a;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3f3f46;
      }

      /* Responsive Mobile Styles */
      @media (max-width: 768px) {
        .responsive-header {
          padding: 10px 14px !important;
          flex-direction: column !important;
          align-items: stretch !important;
          gap: 10px !important;
        }
        .responsive-header-row1 {
          display: flex !important;
          justify-content: space-between !important;
          align-items: center !important;
          width: 100% !important;
        }
        .responsive-persona-switcher {
          width: 100% !important;
          display: flex !important;
          justify-content: space-between !important;
          gap: 4px !important;
        }
        .responsive-persona-switcher button {
          flex: 1 !important;
          padding: 6px 4px !important;
          font-size: 0.72rem !important;
          text-align: center !important;
          white-space: nowrap !important;
        }
        .responsive-main {
          padding: 14px 10px 48px 10px !important;
        }
        .responsive-subnav-scroll {
          width: 100% !important;
          overflow-x: auto !important;
          -webkit-overflow-scrolling: touch !important;
          scrollbar-width: none !important;
          display: flex !important;
          margin-bottom: 20px !important;
          padding-bottom: 4px !important;
        }
        .responsive-subnav-scroll::-webkit-scrollbar {
          display: none !important;
        }
        .responsive-subnav-btn {
          flex-shrink: 0 !important;
          white-space: nowrap !important;
          padding: 7px 12px !important;
          font-size: 0.75rem !important;
        }
        .kpi-grid-container {
          grid-template-columns: repeat(2, 1fr) !important;
          gap: 10px !important;
        }
        .kpi-metric-card {
          padding: 16px 14px !important;
          border-radius: 12px !important;
        }
        .kpi-metric-card-span2 {
          grid-column: 1 / -1 !important;
        }
        .kpi-metric-value {
          font-size: 1.85rem !important;
          margin-top: 10px !important;
        }
        .secondary-grid-container {
          grid-template-columns: 1fr !important;
          gap: 14px !important;
        }
        .hide-on-mobile {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
